name: Tag Categories
description: Browse scenes by named categories — each category lists tags; click to show scenes matching any of those tags
version: 1.4.3
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - tagCategories.js
  css:
    - tagCategories.css
  assets:
    /: .
settings:
  categoriesJson:
    displayName: Categories (JSON)
    description: "This card only stores JSON. Simple form: left menu Extensions → Tag Categories, or /plugin/tagCategories/assets/app/"
    type: STRING
