name: Tag Categories
description: Browse scenes by named categories — each category lists tags; click to show scenes matching any of those tags
version: 1.4.2
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - tagCategories.js
  css:
    - tagCategories.css
  assets:
    /: .
settings:
  categoriesJson:
    displayName: Categories (JSON)
    description: "JSON storage. Simple form: /plugin/tag-categories-settings (classic Stash, or Stash UI → Extensions)."
    type: STRING
