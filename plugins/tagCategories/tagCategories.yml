name: Tag Categories
description: Browse scenes by named categories - each category lists tags; click to show scenes matching any of those tags
version: 1.4.4
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - tagCategories.js
  css:
    - tagCategories.css
  assets:
    /: .
settings:
  c1Name:
    displayName: "1 - Category name"
    type: STRING
  c1Tags:
    displayName: "1 - Tags"
    description: "Comma-separated. A scene matches if it has any of these tags."
    type: STRING
