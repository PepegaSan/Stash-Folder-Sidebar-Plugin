name: Tag Categories
description: Browse scenes by named categories. Each category lists tags; a scene matches if it has any of them.
version: 1.4.5
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - tagCategories.js
  css:
    - tagCategories.css
  assets:
    /: .
settings:

  c1:
    displayName: "Category 1"
    description: "Name | tag1, tag2. A scene matches if it has any of these tags."
    type: STRING

  c2:
    displayName: "Category 2"
    description: "Same format as Category 1. Leave empty to skip."
    type: STRING

