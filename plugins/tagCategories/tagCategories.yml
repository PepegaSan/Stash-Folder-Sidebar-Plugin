name: Tag Categories
description: Browse scenes by named categories — each category lists tags and performers; click to show scenes matching any of them, narrow down with chips and a main tag
version: 1.9.0
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - tagCategories.js
  css:
    - tagCategories.css
  assets:
    /: .
settings:
  categoriesJson:
    displayName: Categories (JSON)
    description: "Categories with name, tags array and optional performers array. Prefer the settings UI; see categories.json.example."
    type: STRING
