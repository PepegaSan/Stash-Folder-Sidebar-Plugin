<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag Categories</title>
  <style>
    :root { color-scheme: dark; --bg:#16121c; --card:#221c2b; --line:rgba(255,255,255,.12); --text:#f4eef8; --muted:rgba(244,238,248,.68); --pink:#e85d9a; --danger:#d4536a; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 Bahnschrift,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:820px; margin:0 auto; padding:1.25rem; }
    a { color:var(--pink); }
    h1 { margin:0 0 .25rem; }
    .muted { color:var(--muted); }
    .row { display:flex; justify-content:space-between; gap:1rem; align-items:center; }
    button { border:0; border-radius:.4rem; padding:.45rem .8rem; font:inherit; cursor:pointer; color:white; background:#3a3344; }
    button.primary { background:var(--pink); color:#1a0d14; font-weight:650; }
    button.danger { background:var(--danger); }
    table { width:100%; border-collapse:collapse; margin:1rem 0; }
    th, td { text-align:left; padding:.55rem .4rem; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:.75rem; color:var(--muted); }
    form { background:var(--card); border:1px solid var(--line); border-radius:.6rem; padding:1rem; }
    label { display:block; margin:.75rem 0 .25rem; font-weight:650; }
    label span { display:block; font-weight:400; color:var(--muted); font-size:.85rem; }
    input { width:100%; padding:.55rem .65rem; border-radius:.4rem; border:1px solid var(--line); background:#100d15; color:var(--text); font:inherit; }
    .actions { display:flex; gap:.5rem; margin-top:1rem; }
  </style>
</head>
<body>
<main>
  <div class="row">
    <div>
      <h1>Tag Categories</h1>
      <p class="muted">Same list as the classic settings. Name and tags are separate fields. A scene matches if it has any of the tags.</p>
    </div>
    <a href="/plugin/stashui/assets/index.html#/plugins?focus=tagCategories">Back</a>
  </div>
  <div id="list"></div>
  <form id="editor">
    <h2 id="editorTitle">Add category</h2>
    <label>Name<input id="name" required placeholder="Joi"></label>
    <label>Tags<span>Comma-separated. These are normal tags, not sub-tags of each other.</span><input id="tags" placeholder="Joi, Talk"></label>
    <div class="actions">
      <button class="primary" type="submit" id="saveBtn">Add</button>
      <button type="button" id="cancelBtn">Cancel</button>
    </div>
  </form>
  <p class="muted" id="status"></p>
</main>
<script>
const PLUGIN = "tagCategories";
let bag = {};
let categories = [];
let editIndex = -1;
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function gql(query, variables){
  const res = await fetch("/graphql",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({query,variables})});
  const json = await res.json();
  if(!res.ok||json.errors) throw new Error((json.errors||[]).map(e=>e.message).join("; ")||res.statusText);
  return json.data;
}
function loadCategories(data){
  if(data.categoriesJson && String(data.categoriesJson).trim()){
    try {
      const parsed=JSON.parse(data.categoriesJson);
      const list=parsed.categories||parsed;
      if(Array.isArray(list) && list.length) return list.map(c=>({id:c.id,name:c.name,tags:c.tags||[]}));
    } catch(e){}
  }
  const list=[];
  for(let i=1;i<=12;i++){
    const line=String(data["c"+i]||"").trim();
    if(line){
      const parts=line.split("|");
      const tags=(parts.slice(1).join("|")||"").split(",").map(t=>t.trim()).filter(Boolean);
      if(parts[0].trim()||tags.length) list.push({name:parts[0].trim()||tags[0], tags});
      continue;
    }
    const name=String(data["c"+i+"Name"]||"").trim();
    const tags=String(data["c"+i+"Tags"]||"").split(",").map(t=>t.trim()).filter(Boolean);
    if(name||tags.length) list.push({name:name||tags[0], tags});
  }
  return list;
}
function render(){
  document.getElementById("list").innerHTML=`<table><thead><tr><th>Name</th><th>Tags</th><th></th></tr></thead><tbody>${
    categories.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${esc((c.tags||[]).join(", "))}</td><td><button type="button" data-edit="${i}">Edit</button> <button type="button" class="danger" data-del="${i}">Delete</button></td></tr>`).join("") || `<tr><td colspan="3" class="muted">No categories yet.</td></tr>`
  }</tbody></table><button type="button" id="addBtn">Add category</button>`;
}
function fill(c){
  document.getElementById("name").value=c?c.name:"";
  document.getElementById("tags").value=c&&c.tags?c.tags.join(", "):"";
  document.getElementById("editorTitle").textContent=c?"Edit category":"Add category";
  document.getElementById("saveBtn").textContent=c?"Save changes":"Add";
}
async function persist(next){
  const input=Object.assign({}, bag, {categoriesJson: JSON.stringify({categories: next.map((c,i)=>({id:c.id||c.name.toLowerCase().replace(/\s+/g,"-")+"-"+i, name:c.name, tags:c.tags}))}, null, 2)});
  for(let i=1;i<=12;i++){
    const c=next[i-1];
    input["c"+i]=c?`${c.name} | ${(c.tags||[]).join(", ")}`:"";
    input["c"+i+"Name"]="";
    input["c"+i+"Tags"]="";
  }
  await gql("mutation($id: ID!, $input: Map!) { configurePlugin(plugin_id: $id, input: $input) { plugins } }",{id:PLUGIN,input});
  bag=input; categories=next;
}
document.getElementById("list").onclick=async(e)=>{
  const edit=e.target.closest("[data-edit]"); const del=e.target.closest("[data-del]"); const add=e.target.closest("#addBtn");
  if(edit){ editIndex=Number(edit.dataset.edit); fill(categories[editIndex]); }
  else if(add){ editIndex=-1; fill(null); }
  else if(del){
    const i=Number(del.dataset.del);
    if(!confirm('Remove category "'+categories[i].name+'"?')) return;
    await persist(categories.filter((_,idx)=>idx!==i));
    if(editIndex===i){ editIndex=-1; fill(null); }
    render(); document.getElementById("status").textContent="Category removed.";
  }
};
document.getElementById("cancelBtn").onclick=()=>{ editIndex=-1; fill(null); };
document.getElementById("editor").onsubmit=async(e)=>{
  e.preventDefault();
  try{
    const name=document.getElementById("name").value.trim();
    const tags=document.getElementById("tags").value.split(",").map(t=>t.trim()).filter(Boolean);
    if(!name) throw new Error("Name is required.");
    const item={name, tags};
    const next=categories.slice();
    if(editIndex>=0) next[editIndex]=Object.assign({}, next[editIndex], item); else next.push(item);
    await persist(next); editIndex=-1; fill(null); render();
    document.getElementById("status").textContent="Saved.";
  }catch(err){ document.getElementById("status").textContent=err.message; }
};
(async function(){
  try{
    const data=await gql("query { configuration { plugins } }");
    bag=(data.configuration.plugins&&data.configuration.plugins[PLUGIN])||{};
    categories=loadCategories(bag); render(); fill(null);
  }catch(err){ document.getElementById("status").textContent=err.message; }
})();
</script>
</body>
</html>
