name: Quick Markers
description: Create scene markers with hotkeys and presets (Shift+1-9 select, Shift+I/O range, Shift+M instant)
version: 1.3.6
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - quickMarkers.js
  css:
    - quickMarkers.css
  assets:
    /: .
settings:
  panelPosition:
    displayName: Scene panel position
    description: "top-left, top-right, bottom-left, bottom-right, or hidden"
    type: STRING
  panelCollapsed:
    displayName: Start scene panel collapsed
    type: BOOLEAN
  touchControls:
    displayName: Touch controls
    description: "auto, on, or off"
    type: STRING
  defaultPreset:
    displayName: Default preset
    description: "1-9. Used by Shift+I/O and Shift+M until you select another preset."
    type: NUMBER
  p1Label:
    displayName: "1 - Label"
    type: STRING
  p1Tag:
    displayName: "1 - Primary tag"
    description: "Must already exist under Tags."
    type: STRING
  p1Extra:
    displayName: "1 - Extra tags"
    description: "Comma-separated. Leave empty for none."
    type: STRING
  p1Select:
    displayName: "1 - Select key"
    description: "1-9, or empty. Shift+that number selects this preset."
    type: STRING
  p1In:
    displayName: "1 - In key"
    description: "Empty uses shift+i"
    type: STRING
  p1Out:
    displayName: "1 - Out key"
    description: "Empty uses shift+o"
    type: STRING
  p1Instant:
    displayName: "1 - Instant key"
    description: "Empty uses shift+m"
    type: STRING
