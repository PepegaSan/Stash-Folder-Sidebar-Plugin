name: Quick Markers
description: Guided scene markers with saved in points, presets and hotkeys; marker transfer and sync — classic Stash and Stash UI
version: 1.14.5
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - guide.js
    - quickMarkers.js
  css:
