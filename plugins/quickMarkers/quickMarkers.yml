name: Quick Markers
description: Create scene markers with hotkeys and presets (Shift+1–9 select, Shift+I/O range, Shift+M instant)
version: 1.3.2
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - quickMarkers.js
  css:
    - quickMarkers.css
  assets:
    /: .
settings:
  presetsJson:
    displayName: Marker presets (JSON)
    description: "Presets with primaryTag, optional tags array, and hotkeys. See presets.json.example."
    type: STRING
