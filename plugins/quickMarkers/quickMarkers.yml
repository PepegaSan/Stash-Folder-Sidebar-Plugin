name: Quick Markers
description: "Preset list with separate fields is on the Project page link. Settings here are only the panel options."
version: 1.3.8
url: /plugin/quickMarkers/assets/app/
ui:
  javascript:
    - quickMarkers.js
  css:
    - quickMarkers.css
  assets:
    /: .
settings:
  panelPosition:
    displayName: Scene panel position
    description: "top-left, top-right, bottom-left, bottom-right, or hidden"
    type: STRING
  panelCollapsed:
    displayName: Start scene panel collapsed
    type: BOOLEAN
  touchControls:
    displayName: Touch controls
    description: "auto, on, or off"
    type: STRING
  defaultPreset:
    displayName: Default preset
    description: "1-9. Used by Shift+I/O and Shift+M until you select another preset."
    type: NUMBER
