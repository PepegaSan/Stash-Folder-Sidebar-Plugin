name: Quick Markers
description: Create scene markers with hotkeys and presets (Shift+1–9 select, Shift+I/O range, Shift+M instant), copy markers between scenes and same videos, Marker Sync overview — classic Stash and Stash UI
version: 1.7.0
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - quickMarkers.js
  css:
    - quickMarkers.css
  assets:
    /: .
settings:
  presetsJson:
    displayName: Marker presets (JSON)
    description: "Presets with primaryTag, optional tags array, and hotkeys. See presets.json.example."
    type: STRING
