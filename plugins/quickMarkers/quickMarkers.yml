name: Quick Markers
description: Create scene markers with hotkeys and presets (Shift+1–9 select, Shift+I/O range, Shift+M instant)
version: 1.3.4
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - quickMarkers.js
  css:
    - quickMarkers.css
  assets:
    /: .
settings:
  presetsJson:
    displayName: Marker presets (JSON)
    description: "JSON storage. Simple form: /plugin/quick-markers-settings (classic Stash, or Stash UI → Extensions)."
    type: STRING
