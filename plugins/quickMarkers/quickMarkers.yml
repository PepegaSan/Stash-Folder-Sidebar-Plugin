name: Quick Markers
description: Create scene markers with hotkeys and presets (Shift+1-9 select, Shift+I/O range, Shift+M instant)
version: 1.3.7
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - quickMarkers.js
  css:
    - quickMarkers.css
  assets:
    /: .
settings:
  panelPosition:
    displayName: Scene panel position
    description: "top-left, top-right, bottom-left, bottom-right, or hidden"
    type: STRING
  panelCollapsed:
    displayName: Start scene panel collapsed
    type: BOOLEAN
  touchControls:
    displayName: Touch controls
    description: "auto, on, or off"
    type: STRING
  defaultPreset:
    displayName: Default preset
    description: "1-9. Used by Shift+I/O and Shift+M until you select another preset."
    type: NUMBER

  p1:
    displayName: "Preset 1"
    description: "Label | Primary tag | extra marker tags | select | in | out | instant. Extra tags are additional tags on the marker, not sub-tags. Example: Compilation | Compilation | Favorite | 1 | shift+i | shift+o | shift+m"
    type: STRING

  p2:
    displayName: "Preset 2"
    description: "Same format as Preset 1. Leave empty to skip."
    type: STRING

  p3:
    displayName: "Preset 3"
    description: "Same format as Preset 1. Leave empty to skip."
    type: STRING

  p4:
    displayName: "Preset 4"
    description: "Same format as Preset 1. Leave empty to skip."
    type: STRING

  p5:
    displayName: "Preset 5"
    description: "Same format as Preset 1. Leave empty to skip."
    type: STRING

  p6:
    displayName: "Preset 6"
    description: "Same format as Preset 1. Leave empty to skip."
    type: STRING

  p7:
    displayName: "Preset 7"
    description: "Same format as Preset 1. Leave empty to skip."
    type: STRING

  p8:
    displayName: "Preset 8"
    description: "Same format as Preset 1. Leave empty to skip."
    type: STRING

  p9:
    displayName: "Preset 9"
    description: "Same format as Preset 1. Leave empty to skip."
    type: STRING
