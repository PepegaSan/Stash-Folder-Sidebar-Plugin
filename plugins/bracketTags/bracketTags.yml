name: Bracket Tags
description: Add scene tags from [bracketed] parts of the filename
version: 1.2.0
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
exec:
  - bracketTags.js
interface: js
settings:
  createMissingTags:
    displayName: Create missing tags
    description: Create tags in Stash when they do not exist yet.
    type: BOOLEAN
  autoOnScan:
    displayName: Auto on new scenes
    description: Add bracket tags when a scene is created (e.g. after library scan). Only adds, never removes.
    type: BOOLEAN
hooks:
  - name: Apply bracket tags on scene create
    description: Runs when auto on new scenes is enabled.
    triggeredBy:
      - Scene.Create.Post
    defaultArgs:
      mode: hook
tasks:
  - name: Add bracket tags to all scenes
    description: Add tags from [brackets] in filenames to all scenes. Existing tags are never removed, so old tags stay until you sync.
    defaultArgs:
      mode: allScenes
  - name: Sync bracket tags (add + remove stale)
    description: Add tags from [brackets] and remove bracket tags whose [bracket] is no longer in the filename. Only tags under the parent tag "Bracket Tags" are removed (a manually added tag with the same name too). Scenes without brackets and organized scenes are never changed.
    defaultArgs:
      mode: syncScenes
