<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folder Sidebar</title>
  <style>
    :root { color-scheme: dark; --bg:#16121c; --card:#221c2b; --line:rgba(255,255,255,.12); --text:#f4eef8; --muted:rgba(244,238,248,.68); --pink:#e85d9a; --danger:#d4536a; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 Bahnschrift,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:820px; margin:0 auto; padding:1.25rem; }
    a { color:var(--pink); }
    h1 { margin:0 0 .25rem; }
    .muted { color:var(--muted); }
    .row { display:flex; justify-content:space-between; gap:1rem; align-items:center; }
    button { border:0; border-radius:.4rem; padding:.45rem .8rem; font:inherit; cursor:pointer; color:white; background:#3a3344; }
    button.primary { background:var(--pink); color:#1a0d14; font-weight:650; }
    button.danger { background:var(--danger); }
    table { width:100%; border-collapse:collapse; margin:1rem 0; }
    th, td { text-align:left; padding:.55rem .4rem; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:.75rem; color:var(--muted); }
    form { background:var(--card); border:1px solid var(--line); border-radius:.6rem; padding:1rem; }
    label { display:block; margin:.75rem 0 .25rem; font-weight:650; }
    input { width:100%; padding:.55rem .65rem; border-radius:.4rem; border:1px solid var(--line); background:#100d15; color:var(--text); font:inherit; }
    .actions { display:flex; gap:.5rem; margin-top:1rem; }
  </style>
</head>
<body>
<main>
  <div class="row">
    <div>
      <h1>Folder Sidebar</h1>
      <p class="muted">Same list as the classic settings. Edit one folder at a time; name and path are separate fields.</p>
    </div>
    <a href="/plugin/stashui/assets/index.html#/plugins?focus=folderSidebar">Back</a>
  </div>
  <div id="list"></div>
  <form id="editor">
    <h2 id="editorTitle">Add folder</h2>
    <label>Name<input id="name" required placeholder="AMV"></label>
    <label>Path<input id="path" required placeholder="D:/Media/AMV"></label>
    <div class="actions">
      <button class="primary" type="submit" id="saveBtn">Add</button>
      <button type="button" id="cancelBtn">Cancel</button>
    </div>
  </form>
  <p class="muted" id="status"></p>
</main>
<script>
const PLUGIN = "folderSidebar";
let bag = {};
let folders = [];
let editIndex = -1;
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function gql(query, variables){
  const res = await fetch("/graphql",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({query,variables})});
  const json = await res.json();
  if(!res.ok||json.errors) throw new Error((json.errors||[]).map(e=>e.message).join("; ")||res.statusText);
  return json.data;
}
function loadFolders(data){
  if(data.foldersJson && String(data.foldersJson).trim()){
    try { const parsed = JSON.parse(data.foldersJson); if(Array.isArray(parsed) && parsed.length) return parsed.map(f=>({label:f.label,path:f.path})); } catch(e){}
  }
  const list=[];
  for(let i=1;i<=12;i++){
    const line=String(data["f"+i]||"").trim();
    if(line){ const parts=line.split("|"); list.push({label:parts[0].trim(), path:parts.slice(1).join("|").trim()}); continue; }
    const label=String(data["f"+i+"Label"]||"").trim();
    const path=String(data["f"+i+"Path"]||"").trim();
    if(label||path) list.push({label:label||path, path});
  }
  return list;
}
function render(){
  document.getElementById("list").innerHTML = `<table><thead><tr><th>Name</th><th>Path</th><th></th></tr></thead><tbody>${
    folders.map((f,i)=>`<tr><td>${esc(f.label)}</td><td>${esc(f.path)}</td><td><button type="button" data-edit="${i}">Edit</button> <button type="button" class="danger" data-del="${i}">Delete</button></td></tr>`).join("") || `<tr><td colspan="3" class="muted">No folders yet.</td></tr>`
  }</tbody></table><button type="button" id="addBtn">Add folder</button>`;
}
function fill(f){
  document.getElementById("name").value=f?f.label:"";
  document.getElementById("path").value=f?f.path:"";
  document.getElementById("editorTitle").textContent=f?"Edit folder":"Add folder";
  document.getElementById("saveBtn").textContent=f?"Save changes":"Add";
}
async function persist(next){
  const input=Object.assign({}, bag, {foldersJson: JSON.stringify(next.map(f=>({label:f.label, path:String(f.path).replace(/[/\\]+$/,"")})), null, 2)});
  for(let i=1;i<=12;i++){
    const f=next[i-1];
    input["f"+i]=f?`${f.label} | ${String(f.path).replace(/[/\\]+$/,"")}`:"";
    input["f"+i+"Label"]="";
    input["f"+i+"Path"]="";
  }
  await gql("mutation($id: ID!, $input: Map!) { configurePlugin(plugin_id: $id, input: $input) { plugins } }",{id:PLUGIN,input});
  bag=input; folders=next;
}
document.getElementById("list").onclick=async(e)=>{
  const edit=e.target.closest("[data-edit]"); const del=e.target.closest("[data-del]"); const add=e.target.closest("#addBtn");
  if(edit){ editIndex=Number(edit.dataset.edit); fill(folders[editIndex]); }
  else if(add){ editIndex=-1; fill(null); }
  else if(del){
    const i=Number(del.dataset.del);
    if(!confirm('Remove folder "'+folders[i].label+'"?')) return;
    await persist(folders.filter((_,idx)=>idx!==i));
    if(editIndex===i){ editIndex=-1; fill(null); }
    render(); document.getElementById("status").textContent="Folder removed.";
  }
};
document.getElementById("cancelBtn").onclick=()=>{ editIndex=-1; fill(null); };
document.getElementById("editor").onsubmit=async(e)=>{
  e.preventDefault();
  try{
    const item={label:document.getElementById("name").value.trim(), path:document.getElementById("path").value.trim()};
    if(!item.label||!item.path) throw new Error("Name and path are required.");
    const next=folders.slice();
    if(editIndex>=0) next[editIndex]=item; else next.push(item);
    await persist(next); editIndex=-1; fill(null); render();
    document.getElementById("status").textContent="Saved.";
  }catch(err){ document.getElementById("status").textContent=err.message; }
};
(async function(){
  try{
    const data=await gql("query { configuration { plugins } }");
    bag=(data.configuration.plugins&&data.configuration.plugins[PLUGIN])||{};
    folders=loadFolders(bag); render(); fill(null);
  }catch(err){ document.getElementById("status").textContent=err.message; }
})();
</script>
</body>
</html>
