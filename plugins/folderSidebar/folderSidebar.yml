name: Folder Sidebar
description: Sidebar with configurable folder shortcuts; browse subfolders and list scenes by path without filters
version: 1.4.8
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - folderSidebar.js
  css:
    - folderSidebar.css
  assets:
    /: .
settings:
  foldersJson:
    displayName: Folder list (JSON storage)
    description: "This card only stores JSON. Simple form: left menu Extensions → Folder Sidebar, or /plugin/folderSidebar/assets/app/"
    type: STRING
