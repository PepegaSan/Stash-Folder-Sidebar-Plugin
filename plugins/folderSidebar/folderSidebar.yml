name: Folder Sidebar
description: Sidebar with configurable folder shortcuts; browse subfolders and list scenes by path without filters
version: 1.5.0
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - folderSidebar.js
  css:
    - folderSidebar.css
  assets:
    /: .
settings:

  f1:
    displayName: "Folder 1"
    description: "Name | path. Example: AMV | D:/Media/AMV"
    type: STRING

  f2:
    displayName: "Folder 2"
    description: "Same format as Folder 1. Leave empty to skip."
    type: STRING

