name: Folder Sidebar
description: Sidebar with configurable folder shortcuts; browse subfolders and list scenes by path without filters
version: 1.4.9
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - folderSidebar.js
  css:
    - folderSidebar.css
  assets:
    /: .
settings:
  f1Label:
    displayName: "1 - Folder name"
    type: STRING
  f1Path:
    displayName: "1 - Path"
    description: "Example D:\Media\AMV or /data/AMV"
    type: STRING
