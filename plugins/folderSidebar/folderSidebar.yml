name: Folder Sidebar
description: Sidebar with configurable folder shortcuts; browse subfolders and list scenes by path without filters
version: 1.4.7
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin
ui:
  javascript:
    - folderSidebar.js
  css:
    - folderSidebar.css
  assets:
    /: .
settings:
  foldersJson:
    displayName: Folder list (JSON storage)
    description: "JSON storage. Simple form: /plugin/folder-sidebar-settings (classic Stash, or Stash UI → Extensions)."
    type: STRING
