# Plugin id = file name without .yml  ->  "pmv-creator"
name: PMV Creator
description: Deterministic PMV editor – pick scenes and markers, arrange them on a beat grid, fine-tune every clip and render with FFmpeg or export as EDL/OTIO. Works in classic Stash and in Stash UI.
version: 0.7.1
url: https://github.com/PepegaSan/Stash-Folder-Sidebar-Plugin

ui:
  # bundle from build.mjs (uses PluginApi.React, registers the route /pmv-creator)
  javascript:
    - pmv-creator.js
  css:
    - pmv-creator.css
  # /plugin/pmv-creator/assets/…  ->  assets/
  #   stashui.js   extension module for Stash UI (Watch menu entry, editor as an overlay page)
  #   media/       uploaded music (waveform + preview in the browser)
  assets:
    /: assets
  # the render helper on a PC streams videos for the preview (only fetch() may reach it; media-src cannot be
  # extended by plugins, so the editor plays it through Media Source Extensions) – ports as in pmv_backend.py
  csp:
    connect-src:
      - http://*:9978
      - http://*:9979
      - http://*:9980
      - http://*:9981

# Backend: project files, audio upload, keyframe probe, motion analysis, FFmpeg render.
# Stash replaces "python" with the configured Python path.
exec:
  - python
  - "{pluginDir}/backend/pmv_backend.py"
interface: raw
errLog: error

settings:
  ffmpegPath:
    displayName: FFmpeg path
    description: Leave empty to use Stash's FFmpeg or the one on the PATH.
    type: STRING
  ffprobePath:
    displayName: FFprobe path
    description: Leave empty to use Stash's FFprobe or the one on the PATH.
    type: STRING
  outputDir:
    displayName: Output folder
    description: Where finished PMVs go (default <plugin>/data/renders). Inside a Stash library it can be scanned automatically afterwards.
    type: STRING
  projectDir:
    displayName: Project folder
    description: Where the .pmv.json project files are kept (default <plugin>/data/projects).
    type: STRING
  parallelJobs:
    displayName: Parallel FFmpeg jobs
    description: How many segments render at the same time (default 2).
    type: NUMBER
  scanAfterRender:
    displayName: Scan after rendering
    description: Starts a Stash scan of the output folder so the PMV shows up as a scene (the folder must lie inside a library).
    type: BOOLEAN
  clearCache:
    displayName: Clear the segment cache after rendering
    description: By default rendered segments are kept, so re-renders after small changes are fast.
    type: BOOLEAN

tasks:
  - name: Render PMV
    description: Renders a PMV project. Started from the PMV Creator page (needs a render plan).
    defaultArgs:
      mode: render
